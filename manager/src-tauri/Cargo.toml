[package]
name = "nexus-mod-manager"
version = "0.1.0"
description = "Choose, test and run code mods for Endless Sky"
authors = ["Nexus Mod Platform contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
